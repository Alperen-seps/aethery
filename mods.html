<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethery - Modlar ve Eklentiler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">AETHERY <span>Mod Hub</span></div>
        <div class="nav-links">
            <a href="index.html">Ana Sayfa</a>
            <a href="mods.html" class="active">Modlar</a>
            <a href="servers.html">Sunucular</a>
        </div>
    </nav>

    <div class="content-container">
        <h2>Minecraft Mod Kütüphanesi</h2>
        <p>Topluluk tarafından paylaşılan modları indir veya kendi modunu hemen yükle!</p>

        <!-- Mod Yükleme Formu -->
        <div class="server-form-card">
            <h3>+ Kendi Modunu Paylaş</h3>
            <form id="add-mod-form">
                <input type="text" id="mod-name" placeholder="Mod Adı (Örn: FPS Optimizer)" required>
                <input type="text" id="mod-category" placeholder="Kategori (Örn: Optimizasyon / PvP / Harita)" required>
                <input type="text" id="mod-desc" placeholder="Kısa Açıklama" required>
                <input type="url" id="mod-link" placeholder="İndirme Linki (https://...)" required>
                <button type="submit" class="btn btn-primary">Modu Yayınla</button>
            </form>
        </div>

        <!-- Modların Listelendiği Alan -->
        <div class="mod-grid" id="mod-list">
            <!-- Firebase verileri buraya dinamik olarak dolacak -->
        </div>
    </div>

    <footer class="site-footer">
        <p>Aethery Mod & Server Community | <strong>Owned BY ALPEREN_226</strong></p>
    </footer>

    <script type="module" src="script.js"></script>
</body>
</html>
