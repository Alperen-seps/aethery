<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethery - Sunucu Forumu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">AETHERY <span>Server Hub</span></div>
        <div class="nav-links">
            <a href="index.html">Ana Sayfa</a>
            <a href="mods.html">Modlar</a>
            <a href="servers.html" class="active">Sunucular</a>
            <a href="apply.html">Başvuru</a>
            <a href="admin.html" id="nav-admin-link" style="display: none; color: #ff5555;">Yönetici Paneli</a>
            <a href="login.html" id="nav-auth-link">Giriş Yap</a>
        </div>
    </nav>

    <div class="content-container">
        <h2>Topluluk Sunucu Forumu</h2>
        <p>Kendi Minecraft sunucunun IP adresini paylaş, oyuncu kitleni büyüt!</p>

        <div class="server-form-card">
            <h3>+ Sunucunu Ekle</h3>
            <form id="add-server-form">
                <input type="text" id="server-name" placeholder="Sunucu Adı (Örn: AetheryCraft)" required>
                <input type="text" id="server-ip" placeholder="Sunucu IP Adresi (Örn: play.aethery.net)" required>
                <input type="text" id="server-desc" placeholder="Kısa Açıklama (Örn: Survival / Faction)" required>
                <button type="submit" class="btn btn-primary">Sunucuyu Yayınla</button>
            </form>
        </div>

        <div class="server-grid" id="server-list"></div>
    </div>

    <footer class="site-footer">
        <p>Aethery Mod & Server Community | <strong>Owned BY ALPEREN_226</strong></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
